<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מחשבון ריבית דריבית</title>
    <style>
        body { font-family: -apple-system, sans-serif; background-color: #0f172a; color: #f8fafc; margin: 0; padding: 20px; direction: rtl; }
        .container { max-width: 400px; background: #1e293b; padding: 24px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); margin: auto; }
        h2 { text-align: center; color: #38bdf8; margin-top: 0; font-size: 22px; }
        .form-group { margin-bottom: 16px; }
        label { display: block; margin-bottom: 6px; font-size: 14px; color: #94a3b8; }
        input { width: 100%; padding: 12px; box-sizing: border-box; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: #fff; font-size: 16px; outline: none; }
        input:focus { border-color: #38bdf8; }
        button { width: 100%; background: #0284c7; color: white; border: none; padding: 14px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; margin-top: 10px; }
        button:active { background: #0369a1; }
        .result { margin-top: 20px; background: #0f172a; padding: 16px; border-radius: 8px; font-size: 18px; text-align: center; border: 1px solid #334155; }
        .result strong { color: #4ade80; display: block; font-size: 24px; margin-top: 5px; }
    </style>
</head>
<body>

<div class="container">
    <h2>מחשבון ריבית דריבית 📈</h2>
    <div class="form-group">
        <label>סכום התחלתי (ש"ח):</label>
        <input type="number" id="principal" value="10000">
    </div>
    <div class="form-group">
        <label>הפקדה חודשית (ש"ח):</label>
        <input type="number" id="monthly" value="1000">
    </div>
    <div class="form-group">
        <label>תשואה שנתית משוערת (%):</label>
        <input type="number" id="rate" value="8" step="0.1">
    </div>
    <div class="form-group">
        <label>משך זמן (שנים):</label>
        <input type="number" id="years" value="10">
    </div>
    <button onclick="calculate()">חשב תוצאה</button>

    <div class="result" id="result">
        הסכום הצפוי:
        <strong id="total-val">₪0</strong>
    </div>
</div>

<script>
function calculate() {
    let p = parseFloat(document.getElementById('principal').value) || 0;
    let pmt = parseFloat(document.getElementById('monthly').value) || 0;
    let r = (parseFloat(document.getElementById('rate').value) || 0) / 100 / 12;
    let n = (parseFloat(document.getElementById('years').value) || 0) * 12;

    let total = p;
    for (let i = 0; i < n; i++) {
        total = (total + pmt) * (1 + r);
    }

    document.getElementById('total-val').innerText = `₪${Math.round(total).toLocaleString('he-IL')}`;
}
calculate();
</script>

</body>
</html>
